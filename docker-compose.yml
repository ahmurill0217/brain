# OpenSearch service settings derived from Onyx's deployment/docker_compose.
#
# Three containers: the search index, the embedding model server, and brain's
# own API. The model server is separate because it is the only thing here that
# needs PyTorch, and keeping it out of the API image takes that image from
# gigabytes to megabytes.

name: brain

services:
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    restart: unless-stopped
    environment:
      # Single node: no cluster formation, no waiting for peers that will
      # never arrive.
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      # Keep the JVM heap out of swap. Paging a vector index is catastrophic
      # for latency, so it is better to fail on memory than to silently crawl.
      - bootstrap.memory_lock=true
      # Heap at roughly half the container's memory, per OpenSearch guidance.
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # Published so the external test suite can reach it from the host.
      - "${OPENSEARCH_HOST_PORT:-9201}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD
          https://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  model_server:
    build:
      context: ./model_server
    restart: unless-stopped
    ports:
      - "${MODEL_SERVER_HOST_PORT:-9100}:9000"
    volumes:
      # The image already carries the weights; this only preserves anything
      # downloaded later, and lets a rebuild reuse the cache.
      - model-cache:/app/.cache/huggingface
    # No healthcheck override: the image defines its own, and it probes with
    # Python rather than curl, which this image deliberately does not carry.

  brain-api:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${BRAIN_API_HOST_PORT:-8100}:8100"
    environment:
      - BRAIN_OPENSEARCH_HOST=opensearch
      - BRAIN_OPENSEARCH_PORT=9200
      - BRAIN_OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - BRAIN_MODEL_SERVER_HOST=model_server
      - BRAIN_MODEL_SERVER_PORT=9000
      - BRAIN_DOCUMENT_STORE_URL=sqlite:////data/brain.db
      # Documents arrive world-readable unless the caller supplies permissions.
      # Set false to fail closed.
      - BRAIN_DEFAULT_DOCUMENT_PUBLIC=${BRAIN_DEFAULT_DOCUMENT_PUBLIC:-true}
      - BRAIN_API_KEY=${BRAIN_API_KEY:-}
      # Answering needs an LLM; ingest and search do not.
      - BRAIN_LLM_PROVIDER=${BRAIN_LLM_PROVIDER:-}
      - BRAIN_LLM_MODEL=${BRAIN_LLM_MODEL:-}
      - BRAIN_LLM_API_KEY=${BRAIN_LLM_API_KEY:-}
      - VERTEXAI_PROJECT=${VERTEXAI_PROJECT:-}
      - VERTEXAI_LOCATION=${VERTEXAI_LOCATION:-}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - brain-data:/data
    depends_on:
      opensearch:
        condition: service_healthy
      model_server:
        condition: service_healthy
    # The image defines its own healthcheck; see Dockerfile.

volumes:
  opensearch-data:
  model-cache:
  brain-data:
