#
# Two containers: the search index and brain's own API. Both models are on
# Vertex AI, reached with Application Default Credentials; see brain-api below.

name: brain

services:
  opensearch:
    image: opensearchproject/opensearch:3.6.0
    restart: unless-stopped
    environment:
      # Single node: no cluster formation, no waiting for peers that will
      # never arrive.
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      # Keep the JVM heap out of swap. Paging a vector index is catastrophic
      # for latency, so it is better to fail on memory than to silently crawl.
      - bootstrap.memory_lock=true
      # Heap at roughly half the container's memory, per OpenSearch guidance.
      - OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      # Published so the external test suite can reach it from the host.
      - "${OPENSEARCH_HOST_PORT:-9201}:9200"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sk -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD
          https://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  brain-api:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${BRAIN_API_HOST_PORT:-8100}:8100"
    environment:
      - BRAIN_OPENSEARCH_HOST=opensearch
      - BRAIN_OPENSEARCH_PORT=9200
      - BRAIN_OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-StrongPassword123!}
      - BRAIN_DOCUMENT_STORE_URL=sqlite:////data/brain.db
      # Documents arrive world-readable unless the caller supplies permissions.
      # Set false to fail closed.
      - BRAIN_DEFAULT_DOCUMENT_PUBLIC=${BRAIN_DEFAULT_DOCUMENT_PUBLIC:-true}
      - BRAIN_API_KEY=${BRAIN_API_KEY:-}
      - BRAIN_VERTEX_PROJECT=${BRAIN_VERTEX_PROJECT:-}
      - BRAIN_VERTEX_LOCATION=${BRAIN_VERTEX_LOCATION:-us-central1}
      # Answering needs a Gemini model; ingest and search do not.
      - BRAIN_LLM_MODEL=${BRAIN_LLM_MODEL:-}
      - BRAIN_LLM_LOCATION=${BRAIN_LLM_LOCATION:-}
      # Path inside the container to the credentials file. Mount the file
      # itself in a docker-compose.override.yml: a service account key in a
      # deployment, your `gcloud auth application-default login` file locally.
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-}
    volumes:
      - brain-data:/data
    depends_on:
      opensearch:
        condition: service_healthy
    # The image defines its own healthcheck; see Dockerfile.

volumes:
  opensearch-data:
  brain-data:
