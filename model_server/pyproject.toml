[project]
name = "brain-model-server"
version = "0.1.0"
description = "Embedding model server for brain. Extracted from Onyx."
requires-python = ">=3.13"
license = { text = "MIT" }
# Pins follow onyx backend/requirements/model_server.txt so the model behaves
# exactly as measured. numpy, safetensors, filelock, and huggingface-hub are
# transitive, but pinned anyway: they gate whether the baked-in weights load.
dependencies = [
    "torch==2.9.1",
    "sentence-transformers==5.4.1",
    "transformers==5.14.1",
    "tokenizers==0.22.2",
    "huggingface-hub==1.26.0",
    "safetensors==0.8.0",
    "accelerate==1.14.0",
    # nomic-embed's modeling code imports einops directly.
    "einops==0.8.1",
    "numpy==2.4.1",
    "fastapi==0.133.1",
    "uvicorn==0.49.0",
    "pydantic==2.12.5",
    "pydantic-settings>=2.7.0",
]

[project.scripts]
brain-model-server = "brain_model_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_model_server"]

# ---------------------------------------------------------------------------
# torch defaults to the CPU-only wheels, which are ~200 MB against ~2.5 GB for
# the CUDA build. The index is marked explicit so nothing else resolves through
# it, and it is scoped to Linux: the macOS wheels on PyPI are already CPU/MPS
# and the pytorch CPU index does not publish for darwin, so a developer running
# `uv sync` on a Mac must not be sent there.
#
# For a GPU image, override at build time:
#   docker build --build-arg TORCH_VARIANT=cu124 model_server
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "C4", "PIE", "RET"]
ignore = ["E501", "B008", "RUF012", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
# FastAPI route handlers take `request` for app.state even when the body is the
# only thing read from it.
"src/brain_model_server/encoders.py" = ["ARG001"]
