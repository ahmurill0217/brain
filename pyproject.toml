[project]
name = "brain"
version = "0.1.0"
description = "Document ingest, hybrid retrieval, and cited answering."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.12.5,<3",
    "pydantic-settings>=2.7.0,<3",
    "opensearch-py>=3.2.0,<4",
    # 1.1 onwards renames the tokenizer argument and returns chunk objects
    # rather than strings; moving to it is a migration, not a version bump.
    "chonkie>=1.0.10,<1.1",
    "tiktoken>=0.13.0,<1",
    "requests>=2.33.0,<3",
    # Application Default Credentials for Vertex AI.
    "google-auth>=2.40.0,<3",
    "tenacity>=9.1.2,<10",
    "sqlalchemy>=2.0.50,<3",
    # Used only by the tabular column analyzer, whose date detection is pinned
    # by tests/unit/chunking/test_date_parity.py: a release that changes it
    # fails there. Already present transitively via opensearch-py.
    "python-dateutil>=2.9.0.post0,<3",
]

[project.optional-dependencies]
extraction = [
    "pypdf>=6.16.1,<7",
    "pypdfium2>=5.9.0,<6",
    "markitdown[docx,pptx,xlsx,xls]>=0.1.7,<0.2",
    "openpyxl>=3.0.10,<4",
    "beautifulsoup4>=4.12.3,<5",
    "trafilatura>=1.12.2,<2",
    "chardet>=5.2.0,<6",
    "pillow>=11.3.0,<13",
    "msoffcrypto-tool>=6.0.0,<7",
    "lxml>=6.0.1,<7",
]
api = [
    "fastapi>=0.133.1,<1",
    "uvicorn>=0.34.0,<1",
    "sse-starlette>=2.2.0,<4",
    "python-multipart>=0.0.20,<1",
]

[tool.uv]
# brain runs on macOS and Linux. Left to cover Windows too, the lock settles on
# the one onnxruntime (via markitdown -> magika) that Windows allows, and that
# version has no Python 3.14 build.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "import-linter>=2.1",
    "responses>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so test modules can share helpers via
# `from tests.conftest import ...`. Without it, pytest only adds each test
# directory and that import fails at collection time.
pythonpath = ["."]
markers = [
    "external: needs a running OpenSearch",
    "e2e: needs the full docker compose stack",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "C4", "PIE", "RET"]
# UP042: (str, Enum) is deliberate — it serializes predictably through
#         pydantic and JSON, and StrEnum would be churn for no gain.
# UP047: PEP-695 generics are not worth the churn on two helpers.
ignore = ["E501", "B008", "RUF012", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B", "SIM108"]
# Protocol stubs and test doubles must accept the full signature they implement,
# whether or not every argument is used.
"src/brain/*/protocol.py" = ["ARG002"]
"src/brain/*/fake.py" = ["ARG002"]
# The curly-quote normalization table necessarily contains curly quotes.
"src/brain/text/processing.py" = ["RUF001"]

[tool.coverage.run]
source = ["src/brain"]

# ---------------------------------------------------------------------------
# Layer enforcement. These contracts make import cycles between indexing,
# retrieval, and the document index impossible rather than merely discouraged.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["brain"]
# Required so the forbidden contracts below can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# Parentheses mark a layer optional, so the contract holds while packages are
# still being filled in. Every layer becomes required once it exists.
layers = [
    "(brain.api)",
    "(brain.facade)",
    "(brain.answer)",
    "(brain.ingest) | (brain.retrieval)",
    "(brain.llm) | (brain.extraction) | (brain.chunking) | (brain.embedding) | (brain.index) | (brain.store)",
    "(brain.vertex)",
    "(brain.text)",
    "(brain.models)",
    "(brain.config)",
    "(brain.constants)",
]

[[tool.importlinter.contracts]]
name = "Core models and text helpers stay dependency-free"
type = "forbidden"
source_modules = ["brain.models", "brain.text"]
forbidden_modules = [
    "opensearchpy",
    "google",
    "chonkie",
    "torch",
    "sqlalchemy",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "No heavyweight infrastructure anywhere"
type = "forbidden"
source_modules = ["brain"]
forbidden_modules = [
    "sentry_sdk",
    "prometheus_client",
    "redis",
    "celery",
    "boto3",
    "langchain_core",
]

[[tool.importlinter.contracts]]
name = "SQLAlchemy is confined to the sqlite store"
type = "forbidden"
source_modules = [
    "brain.models",
    "brain.text",
    "brain.llm",
    "brain.extraction",
    "brain.chunking",
    "brain.embedding",
    "brain.index",
    "brain.ingest",
    "brain.retrieval",
    "brain.answer",
]
forbidden_modules = ["sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Google credentials are confined to brain.vertex"
type = "forbidden"
source_modules = [
    "brain.models",
    "brain.text",
    "brain.llm",
    "brain.extraction",
    "brain.chunking",
    "brain.embedding",
    "brain.index",
    "brain.store",
    "brain.ingest",
    "brain.retrieval",
    "brain.answer",
    "brain.api",
]
forbidden_modules = ["google"]
# Reaching Vertex through brain.vertex is the point; importing google directly
# from anywhere else is what this forbids.
allow_indirect_imports = true
