[project]
name = "brain"
version = "0.1.0"
description = "Document ingest, hybrid retrieval, and cited answering. Extracted from Onyx."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "pydantic==2.12.5",
    "pydantic-settings>=2.7.0",
    "opensearch-py==3.2.0",
    "chonkie==1.0.10",
    "tokenizers==0.22.2",
    "huggingface-hub>=0.27.0",
    "tiktoken==0.13.0",
    "requests==2.33.0",
    "tenacity==9.1.2",
    "sqlalchemy>=2.0.50",
    # Used only by the tabular column analyzer, to match Onyx's date detection
    # exactly. Already present transitively via opensearch-py.
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
extraction = [
    "pypdf==6.16.1",
    "pypdfium2==5.9.0",
    "markitdown[docx,pptx,xlsx,xls]==0.1.7",
    "openpyxl==3.0.10",
    "beautifulsoup4==4.12.3",
    "trafilatura==1.12.2",
    "chardet==5.2.0",
    "pillow>=11.0.0",
    "msoffcrypto-tool==6.0.0",
    "lxml>=5.3.0",
]
llm = ["litellm==1.93.0"]
api = [
    "fastapi==0.133.1",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.2.0",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "import-linter>=2.1",
    "responses>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.uv.workspace]
members = ["model_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so test modules can share helpers via
# `from tests.conftest import ...`. Without it, pytest only adds each test
# directory and that import fails at collection time.
pythonpath = ["."]
markers = [
    "external: needs a running OpenSearch and/or model server",
    "e2e: needs the full docker compose stack",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "C4", "PIE", "RET"]
# UP042: (str, Enum) is deliberate — it matches Onyx and serializes predictably
#         through pydantic and JSON. StrEnum would be a gratuitous divergence.
# UP047: PEP-695 generics are not worth the churn on two helpers.
ignore = ["E501", "B008", "RUF012", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B", "SIM108"]
# Protocol stubs and test doubles must accept the full signature they implement,
# whether or not every argument is used.
"src/brain/*/protocol.py" = ["ARG002"]
"src/brain/*/fake.py" = ["ARG002"]
# The curly-quote normalization table necessarily contains curly quotes.
"src/brain/text/processing.py" = ["RUF001"]

[tool.coverage.run]
source = ["src/brain"]

# ---------------------------------------------------------------------------
# Layer enforcement. Onyx has genuine import cycles (nlp -> indexing,
# document_index -> indexing.models, indexing_pipeline -> document_index).
# These contracts make it impossible to inherit them.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["brain"]
# Required so the forbidden contracts below can name third-party packages.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
# Parentheses mark a layer optional, so the contract holds while packages are
# still being filled in. Every layer becomes required once it exists.
layers = [
    "(brain.api)",
    "(brain.facade)",
    "(brain.answer)",
    "(brain.ingest) | (brain.retrieval)",
    "(brain.llm) | (brain.extraction) | (brain.chunking) | (brain.embedding) | (brain.index) | (brain.store)",
    "(brain.text)",
    "(brain.models)",
    "(brain.config)",
    "(brain.constants)",
]

[[tool.importlinter.contracts]]
name = "Core models and text helpers stay dependency-free"
type = "forbidden"
source_modules = ["brain.models", "brain.text"]
forbidden_modules = [
    "opensearchpy",
    "litellm",
    "chonkie",
    "torch",
    "sqlalchemy",
    "fastapi",
]

[[tool.importlinter.contracts]]
name = "No Onyx infrastructure anywhere"
type = "forbidden"
source_modules = ["brain"]
forbidden_modules = [
    "sentry_sdk",
    "prometheus_client",
    "redis",
    "celery",
    "boto3",
    "langchain_core",
]

[[tool.importlinter.contracts]]
name = "SQLAlchemy is confined to the sqlite store"
type = "forbidden"
source_modules = [
    "brain.models",
    "brain.text",
    "brain.llm",
    "brain.extraction",
    "brain.chunking",
    "brain.embedding",
    "brain.index",
    "brain.ingest",
    "brain.retrieval",
    "brain.answer",
]
forbidden_modules = ["sqlalchemy"]
